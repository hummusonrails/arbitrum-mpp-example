name: verify

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.0.0
            - run: pnpm install --frozen-lockfile
            - run: pnpm verify
            - run: pnpm demo
